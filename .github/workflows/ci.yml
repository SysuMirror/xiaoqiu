name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (light)
        run: |
          python -m pip install -q pydantic pydantic-settings pyyaml langchain-core pytest ruff
      - name: Lint
        run: ruff check app tests
      - name: Unit tests (no network)
        run: pytest tests/test_registry.py -q
