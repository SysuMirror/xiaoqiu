pipeline:
- id: mw_requestid
  name: RequestID
  code:
  - middleware/
- id: mw_attachrequestidtospan
  name: AttachRequestIDToSpan
  code:
  - middleware/
- id: mw_prometheusmetrics
  name: PrometheusMetrics
  code:
  - middleware/
- id: mw_loggertofile
  name: LoggerToFile
  code:
  - middleware/
- id: mw_corsmiddleware
  name: CORSMiddleware
  code:
  - middleware/
- id: mw_auth_groups
  name: Auth(Strict/Optional/OAuth) + BloomFilter + 登录限流
  code:
  - middleware/authMiddleware.go
  - middleware/strict_auth.go
  - middleware/oauthMiddleware.go
  - middleware/user_session.go
  - middleware/login_rate_limit.go
  note: 路由组级挂载（routes.go：auth=Strict+Bloom / noauth=Optional / oauth=OAuth）
layers:
- id: svc_layer
  name: service 层
  kind: layer
  code:
  - service/
  note: 业务逻辑；缓存调用集中于此
- id: repo_layer
  name: repository 层
  kind: layer
  code:
  - repository/
  note: gorm 数据访问唯一出口
- id: model_layer
  name: model / domain
  kind: layer
  code:
  - model/
  - domain/
  note: 实体定义
- id: cache_layer
  name: cache（L1 内存 + L2 Redis）
  kind: layer
  code:
  - cache/
  note: Cache-Aside；L1 逻辑过期可选，L2 Redis 物理 TTL(含 jitter)
- id: mq_layer
  name: mq（Redis 延迟队列）
  kind: layer
  code:
  - mq/
  note: 帖子归档延迟 1h：ZSet 时间索引 + Hash payload；失败重试 3 次进死信
cache_profiles:
- var: ProfilePostDetail
  name: post_detail
  domain: 帖子
  l1_ttl: 5min
  l2_ttl: 30min
  logical_expire: true
- var: ProfileCommentList
  name: comment_list
  domain: 评论
