  note: 热度计算（定时）
  heartbeat: 未接入
- id: job_lottery
  name: lottery.StartAutoDraw
  kind: job
  code:
  - lottery/
  note: 抽奖自动开奖
  heartbeat: 未接入
- id: job_pin
  name: pin.StartClearExpired
  kind: job
  code:
  - pin/
  note: 置顶过期清理
  heartbeat: 未接入
infra:
- id: gateway
  name: nginx 反代
  kind: infra
  code:
  - nginx_proxy/nginx.conf
- id: go_server
  name: Go 后端容器
  kind: infra
  code:
  - main.go
- id: mysql
  name: 论坛 MySQL
  kind: store
  code:
  - common/database.go
- id: redis
  name: Redis
  kind: store
  code: []
  note: 双角色：缓存 L2 + 归档延迟队列；不可用时缓存退化回源 MySQL、归档延迟
- id: cos
  name: 腾讯云 COS
  kind: external
  code:
  - api/cosBucket.go
  note: 音乐文件双写备份（本地盘为主）
- id: server_task
  name: 归档消费端 server-task
  kind: external
  code: []
  note: 独立 Python 服务（sse_market_toiwiki_server-task）：30s 消费 Redis 延迟队列
- id: agent_hook
  name: 小秋（raghook）
  kind: external
  code:
  - controller/raghook.go
  note: 发帖/删帖/转私密 webhook
data_assets:
- id: mysql_data
  store: MySQL ssemarket
  what: 论坛核心表：posts/pcomments/users 等
  backup: mysqldump 定时（main.go 内置备份逻辑）
- id: music_local
  store: 本地盘 sse_market_server_resource
  what: 音乐文件/封面（主存储）+ uploads
  backup: bind-mount 目录，容器重建不丢
- id: music_cos
  store: 腾讯云 COS src/music/**
  what: 音乐双写备份（2026-09 上线）
  backup: 对象存储版本化
- id: agent_pg
  store: Agent PostgreSQL
  what: 小秋状态：checkpoint/记忆/台账/遥测
  backup: 每日 pg_dump
- id: redis_data
  store: Redis
  what: 缓存(L2)+归档延迟队列
  backup: 可重建（非资产，标注）
edges:
- - gateway
  - go_server
  - 请求
- - svc_layer
  - repo_layer
  - 读写
- - repo_layer
  - mysql
  - SQL
- - svc_layer
  - cache_layer
  - cache-aside
- - cache_layer
  - redis
  - L2 读写
- - cache_layer
  - mysql
  - miss 回源
- - svc_layer
  - mq_layer
  - 归档入队
- - mq_layer
  - redis
  - ZSet+Hash
- - redis
  - server_task
  - 30s 消费
- - go_server
  - svc_layer
  - 调用
- - ops_agent
  - go_server
  - 控制
control:
  id: ops_agent
  name: 小秋（控制面）
  kind: control
  actions:
  - status(L1)
  - logs(L1)
  - restart(L3·HITL)
  - raghook(被动)
