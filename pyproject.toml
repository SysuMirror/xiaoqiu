[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "sse-agent"
version = "0.1.0"
description = "XiaoQiu v2 - production-grade LangGraph agent for SSE Market"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "langfuse>=4.17,<5",
    "langchain>=1,<2",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "asyncpg>=0.29",
    "aiomysql>=0.2",
    "jinja2>=3.1",
    "httpx>=0.27",
    "websockets>=14,<17",
    "apscheduler>=3.10",
    "qdrant-client>=1.9",
    "pyjwt>=2.8",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "S110",   # try-except-pass：防御性注入/上下文失败降级是既定设计
    "DTZ",    # 时区显式性：内部时间戳统一 UTC 处理
    "PLW1510", # subprocess check：执行器自行检查 returncode
    "PLW0602",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
